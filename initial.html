<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taniti Travel (Before Feedback)</title><meta name="description" content="Explore lodging, activities, dining, and travel information in this Taniti tourism prototype."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23183c34%27/%3E%3Ctext x=%279%27 y=%2725%27 font-size=%2729%27 font-family=%27Georgia%27 fill=%27%23f7f6ef%27%3Et%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#183c34;--muted:#536b61;--paper:#f7f6ef;--line:#d8ded3;--leaf:#dce6ce;--sun:#e6ad64;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Arial,sans-serif}a{color:inherit}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b35b17;outline-offset:5px}button{cursor:pointer}header{background:var(--paper);border-bottom:1px solid var(--line)}.nav-wrap{max-width:1280px;margin:auto;padding:20px 5%;display:flex;align-items:center;gap:35px}.brand{text-decoration:none;font:700 32px Georgia,serif;letter-spacing:-1px}.brand span{color:#ac671f}.nav{display:flex;gap:23px;align-items:center;margin-left:auto}.nav a{text-decoration:none;font-size:13px;font-weight:bold;padding:9px 0;border-bottom:2px solid transparent}.nav a[aria-current=page]{border-color:var(--ink)}.menu{display:none;border:1px solid var(--line);background:white;padding:8px 13px}.skip{position:absolute;left:15px;top:-100px;background:white;padding:10px;z-index:20}.skip:focus{top:5px}main{max-width:1280px;margin:auto;padding:0 5% 70px;min-height:70vh}h1,h2,h3{font-family:Georgia,serif;line-height:1.12;font-weight:normal;letter-spacing:-.03em}h1{font-size:clamp(42px,5.8vw,76px);margin:14px 0 23px}h2{font-size:38px;margin:12px 0 20px}h3{font-size:26px;margin:14px 0}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:.19em;text-transform:uppercase}.lead{font-size:18px;color:var(--muted);max-width:640px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:6%;align-items:center;padding:64px 0 54px}.hero p{max-width:465px}.hero-art{position:relative}.hero-art svg{width:100%;height:auto;border-radius:48% 48% 6px 6px;display:block}.art-caption{position:absolute;bottom:16px;left:16px;background:var(--paper);padding:6px 14px;font-size:11px;letter-spacing:.1em}.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;border:1px solid var(--ink);padding:12px 20px;background:var(--ink);color:white;text-decoration:none;font-size:14px;border-radius:3px;font-weight:bold}.btn.secondary{background:transparent;color:var(--ink)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 55px;padding:21px 0;gap:20px}.facts span{display:block;color:var(--muted);font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:45px}.section-head a{font-size:14px;margin-bottom:23px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:23px}.card{border:1px solid var(--line);background:var(--white);border-radius:5px;overflow:hidden}.card svg{display:block;width:100%;height:190px;object-fit:cover}.card-body{padding:23px}.card p{color:var(--muted);margin:8px 0 20px}.card a.link{font-weight:bold;text-underline-offset:5px;font-size:14px}.card .tag{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.practical{background:var(--leaf);padding:35px 40px;margin-top:50px;display:flex;justify-content:space-between;gap:25px;align-items:center;border-radius:5px}.practical h2{font-size:31px}.practical p{margin:0}.crumb{font-size:13px;color:var(--muted);padding-top:27px}.intro{padding:30px 0}.intro h1{font-size:54px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 27px}.filter{background:transparent;border:1px solid var(--line);border-radius:25px;padding:9px 20px;color:var(--ink);font-size:14px}.filter[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.detail{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;margin-top:32px}.detail-art svg{width:100%;border-radius:5px}.detail-body{padding:0 0 15px}.detail-body h1{font-size:49px;margin-top:10px}.note{background:#eceee5;border-left:3px solid #638265;padding:17px 20px;color:#354e42;margin:24px 0;font-size:14px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.info{background:var(--white);border:1px solid var(--line);padding:27px;border-radius:4px}.info h2{font-size:29px}.info strong.big{font-family:Georgia,serif;font-size:35px;display:block;margin:9px 0}.info p{color:var(--muted)}.form{max-width:630px;background:var(--white);border:1px solid var(--line);padding:30px}.form label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}.form input,.form select{width:100%;border:1px solid #9bab9e;padding:11px;border-radius:3px;background:white;color:var(--ink)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.form .btn{width:100%;margin-top:10px}.success{background:var(--leaf);padding:22px;margin-top:22px}.success h2{font-size:27px}.error{color:#a12913;font-weight:bold}details{border-bottom:1px solid var(--line);padding:21px 0}summary{font-weight:bold;cursor:pointer;padding-right:20px}details p{max-width:820px;color:var(--muted)}.saved{font-size:14px;padding:10px 15px;border:1px solid var(--ink);background:transparent;color:var(--ink)}footer{background:var(--ink);color:#f0f3e8;padding:35px 6%;display:flex;justify-content:space-between;gap:35px;font-size:12px}footer .brand{font-size:25px}footer p{max-width:470px;opacity:.8}.empty{padding:50px;border:1px dashed var(--line)}[hidden]{display:none!important}.result-count{font-size:13px;color:var(--muted)}@media(max-width:950px){.nav{gap:12px}.nav a{font-size:11px}.grid{gap:15px}.card-body{padding:18px}}@media(max-width:720px){.nav-wrap{flex-wrap:wrap;padding:14px 5%;gap:10px}.menu{display:block;margin-left:auto}.nav{display:none;width:100%;margin:0;flex-direction:column;align-items:stretch;gap:0}.nav.open{display:flex}.nav a{font-size:15px;padding:12px 4px}.hero{grid-template-columns:1fr;gap:32px;padding-top:35px}.hero-art{max-width:500px}.hero-art svg{max-height:350px}.hero h1{font-size:49px}.grid,.detail,.info-grid{grid-template-columns:1fr}.facts{gap:12px;margin-bottom:35px}.facts strong{font-size:13px}.facts span{font-size:11px}.section-head{align-items:start;flex-direction:column;gap:0}.section-head a{margin-top:-10px}.practical{padding:25px;align-items:start;flex-direction:column}.intro h1,.detail-body h1{font-size:40px}.fields{grid-template-columns:1fr}footer{flex-direction:column}.detail{gap:25px}.detail-art svg{max-height:320px}.card svg{height:210px}.form{padding:22px}main{padding-bottom:40px}}
main:focus{outline:none}
</style></head><body>
<a class="skip" href="#content">Skip to content</a><header><div class="nav-wrap"><a class="brand" href="#/">taniti<span>.</span></a><button class="menu" aria-controls="navigation" aria-expanded="false">Menu</button><nav class="nav" id="navigation" aria-label="Main navigation"></nav></div></header><main id="content" tabindex="-1"></main><footer><div><a class="brand" href="#/">taniti.</a><p>An island worth getting to know.</p></div><div><p>Student tourism prototype for the fictional island of Taniti. Illustrations are conceptual. No reservations or payments are processed.</p><a href="#/plan">My saved activities</a></div></footer>
<script>
const $=s=>document.querySelector(s);const main=$('main');
const routes=[['/','Home'],['/stay','Places to Stay'],['/do','Things to Do'],['/eat','Food and Dining'],['/info','Travel Information']];
const arts={
island:`<rect width="600" height="450" fill="#d9e4cf"/><circle cx="460" cy="92" r="46" fill="#eab366"/><path d="M0 218 Q150 204 280 224 T600 211 V450 H0Z" fill="#91b9ae"/><path d="M45 266 215 112 302 248 372 180 544 290Z" fill="#4b7866"/><path d="m167 156 48-44 36 64-32-15-18 10Z" fill="#b8c9a4"/><path d="M0 314Q158 217 291 286T600 272V450H0Z" fill="#e9d7ad"/><path d="M0 349Q120 311 275 337T600 310V450H0Z" fill="#427e75"/><path d="M0 378Q166 352 360 377T600 353" fill="none" stroke="#adccbc" stroke-width="3"/><path d="M49 343 78 216" stroke="#314c35" stroke-width="12"/><path d="M78 218Q13 173 8 225Q45 207 78 218M78 218Q119 159 157 199Q111 193 78 218M78 218Q50 148 39 171Q53 200 78 218" fill="#294f3b"/>`,
forest:`<rect width="600" height="450" fill="#d3dfc7"/><circle cx="430" cy="84" r="46" fill="#e7b86e"/><path d="M0 225 160 74 317 234 448 102 600 241V450H0Z" fill="#92ad86"/><path d="M0 310Q175 212 350 280T600 224V450H0Z" fill="#456f52"/><path d="M180 450Q350 340 263 268Q348 360 293 450Z" fill="#dfc895"/><g fill="#274f3b"><path d="M37 333 100 126 167 333Z"/><path d="M419 335 479 151 556 335Z"/><path d="M-35 366 20 198 88 366Z"/></g><g stroke="#2d4a34" stroke-width="9"><path d="M101 285v165M480 282v168"/></g>`,
stay:`<rect width="600" height="450" fill="#d9e5d1"/><circle cx="464" cy="88" r="44" fill="#ecc487"/><path d="M0 248Q158 167 330 226T600 216V450H0Z" fill="#8eae8c"/><rect x="116" y="183" width="356" height="224" fill="#f3e5c8"/><path d="m83 186 211-115 214 115Z" fill="#547457"/><rect x="251" y="281" width="85" height="126" fill="#537266"/><g fill="#77998b"><path d="M147 224h69v71h-69ZM366 224h69v71h-69Z"/></g><path d="M0 415Q284 383 600 415V450H0Z" fill="#517253"/>`,
food:`<rect width="600" height="450" fill="#e5dcc4"/><path d="M0 0h600v100H0Z" fill="#b2c2a0"/><circle cx="300" cy="242" r="159" fill="#faf6e9"/><circle cx="300" cy="242" r="126" fill="#e9e4d1"/><ellipse cx="324" cy="201" rx="68" ry="51" fill="#fffdf3"/><path d="M170 251Q261 183 350 284Q262 332 170 251" fill="#ae7449"/><path d="m168 251-43-36v70Z" fill="#ae7449"/><g fill="#668452"><ellipse cx="367" cy="297" rx="36" ry="17"/><ellipse cx="397" cy="260" rx="28" ry="18"/></g><path d="M71 98v278M515 98v278" stroke="#557362" stroke-width="11"/>`};
function art(kind='island'){return `<svg viewBox="0 0 600 450" role="img" aria-label="Conceptual ${kind==='stay'?'island lodging':kind==='food'?'local meal':kind==='forest'?'rainforest':'island landscape'} illustration">${arts[kind]}</svg>`}
const stays=[{id:'hotel',name:'Family-owned hotels',tag:'A place to settle in',type:'Hotel',art:'stay',text:'Small, family-owned hotels are among Taniti’s lodging options. All lodging is strictly regulated and regularly inspected by the government.'},{id:'bnb',name:'Bed and breakfasts',tag:'An intimate stay',type:'Bed and breakfast',art:'stay',text:'Taniti has a growing number of bed and breakfasts. All lodging is strictly regulated and regularly inspected by the government.'},{id:'hostel',name:'Hostel',tag:'A lower-cost option',type:'Hostel',art:'stay',text:'An inexpensive hostel is part of Taniti’s range of accommodation. Confirm current rates and room arrangements before booking.'},{id:'resort',name:'Four-star resort',tag:'Resort accommodation',type:'Resort',art:'island',text:'Taniti has one large, four-star resort. Confirm current room types, amenities, prices, and availability before booking.'}];
const activities=[{id:'rainforest',name:'Explore the rainforest',tag:'Rainforest',art:'forest',text:'Explore Taniti’s tropical rainforest through hiking or zip-lining. Confirm current conditions, operator requirements, and access before setting out.'},{id:'beaches',name:'A day by the water',tag:'Beaches',art:'island',text:'Taniti has both sandy and rocky beaches. White sandy beaches surround Yellow Leaf Bay near Taniti City.'},{id:'volcano',name:'Visit the volcano',tag:'Volcano',art:'island',text:'The mountainous interior includes a small, active volcano. Visits are a popular sightseeing activity. Confirm access and current conditions before planning a visit.'},{id:'museum',name:'Discover island history',tag:'Culture',art:'stay',text:'Visit the local history museum or explore Taniti City’s native architecture. The island also has art galleries.'},{id:'snorkeling',name:'See beneath the surface',tag:'Water activities',art:'island',text:'Snorkeling is one of Taniti’s available activities. Ask an operator about equipment, conditions, and participation requirements.'},{id:'fishing',name:'Head out on the water',tag:'Water activities',art:'island',text:'Chartered fishing tours and island boat tours are available. Confirm the departure point, schedule, and costs with the operator.'}];
const cuisines=[{id:'local',name:'Local fish and rice',count:5,text:'Five restaurants primarily serve local fish and rice.'},{id:'american',name:'American-style meals',count:3,text:'Three restaurants serve American-style meals.'},{id:'panasian',name:'Pan-Asian cuisine',count:2,text:'Two restaurants serve Pan-Asian cuisine.'}];
function crumb(title,parent){return `<div class="crumb"><a href="#/">Home</a>${parent?` / <a href="#/${parent[0]}">${parent[1]}</a>`:''} / ${title}</div>`}
function intro(kicker,title,text){return `<section class="intro"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lead">${text}</p></section>`}
function card(item,route){return `<article class="card">${art(item.art)}<div class="card-body"><span class="tag">${item.tag||item.type}</span><h3>${item.name}</h3><p>${route==='stay'?item.text.split('.')[0]+'.':item.text.split('.')[0]+'.'}</p><a class="link" href="#/${route}/${item.id}">View ${route==='stay'?'lodging':'activity'} details <span aria-hidden="true">↗</span></a></div></article>`}
function callout(){return `<section class="practical"><div><div class="eyebrow">A little planning goes a long way</div><h2>Know before you go.</h2><p>Currency, getting around, holiday closures, and everyday essentials.</p></div><a class="btn secondary" href="#/info">Travel information ↗</a></section>`}
let selectedFilter='All';let saved=[];try{saved=JSON.parse(localStorage.getItem('tanitiSaved')||'[]');if(!Array.isArray(saved))saved=[]}catch{}
function home(){return `<section class="hero"><div><div class="eyebrow">Welcome to Taniti · The Pacific</div><h1>A small island.<br>A world to explore.</h1><p class="lead">Find your place between the rainforest and the sea. Plan a visit filled with sandy shores, local flavors, and time outdoors.</p><div class="actions"><a class="btn" href="#/stay">Find a place to stay ↗</a><a class="btn secondary" href="#/do">Explore things to do</a></div></div><div class="hero-art">${art()}<span class="art-caption">AN ILLUSTRATED GLIMPSE OF TANITI</span></div></section><div class="facts"><div><strong>Beaches & rainforest</strong><span>Discover the island’s landscapes</span></div><div><strong>Places to stay</strong><span>From a hostel to a four-star resort</span></div><div><strong>A little local knowledge</strong><span>Make the most of your visit</span></div></div><div class="section-head"><div><div class="eyebrow">Find your island moment</div><h2>What will you discover?</h2></div><a href="#/do">See all activities ↗</a></div><div class="grid">${activities.slice(0,3).map(x=>card(x,'do')).join('')}</div>${callout()}`}
function filters(values){return `<div class="filters" role="group" aria-label="Filter options">${values.map(x=>`<button class="filter" data-filter="${x}" aria-pressed="${selectedFilter===x}">${x}</button>`).join('')}</div>`}
function list(type){const stay=type==='stay',all=stay?stays:activities;const data=all.filter(x=>selectedFilter==='All'||(stay?x.type:x.tag)===selectedFilter);return `${crumb(stay?'Places to Stay':'Things to Do')}${intro(stay?'Stay awhile':'Explore Taniti',stay?'Find your place on the island.':'Make room for discovery.',stay?'Choose a lodging style, explore the details, and prepare for your booking.':'Beaches, rainforest paths, and island culture. Choose what interests you.')} ${filters(['All',...new Set(all.map(x=>stay?x.type:x.tag))])}<p class="result-count" role="status">${data.length} ${stay?'lodging options':'activities'}</p><div class="grid">${data.map(x=>card(x,type)).join('')}</div>${stay?'<p class="note">All lodging is regulated and regularly inspected by the Tanitian government. Confirm room availability, rates, amenities, and policies directly before booking.</p>':callout()}`}
function detail(type,id){const item=(type==='stay'?stays:activities).find(x=>x.id===id);if(!item)return missing();const stay=type==='stay';return `${crumb(item.name,[type,stay?'Places to Stay':'Things to Do'])}<section class="detail"><div class="detail-art">${art(item.art)}</div><div class="detail-body"><div class="eyebrow">${item.tag}</div><h1>${item.name}</h1><p class="lead">${item.text}</p><div class="actions">${stay?`<a class="btn" href="#/booking/${id}">Booking information ↗</a>`:`<button class="btn" id="save" data-id="${id}" aria-pressed="${saved.includes(id)}">${saved.includes(id)?'Saved to my activities ✓':'Save this activity +'}</button><a class="btn secondary" href="#/activity-planning/${id}">Planning information</a>`}</div><p id="save-status" role="status"></p><div class="note">${stay?'Provider names, current prices, and booking contacts are not available in this student prototype.':'Many tourist attractions close on national holidays. Confirm opening information before your visit.'}</div><a href="#/info/transport">Plan how to get around ↗</a><p><a href="#/${type}">← Back to ${stay?'Places to Stay':'Things to Do'}</a></p></div></section>`}
function booking(id){let item=stays.find(x=>x.id===id);if(!item)return missing();return `${crumb('Booking information',['stay/'+id,item.name])}${intro('Prepare your stay','Before you reserve.','Make a short checklist for your accommodation enquiry. This demonstration does not check availability or make a booking.')}<div class="detail"><section class="form"><h2>Your stay checklist</h2><form id="booking-form"><div class="fields"><div><label for="arrival">Arrival date</label><input id="arrival" type="date" required></div><div><label for="departure">Departure date</label><input id="departure" type="date" required></div><div><label for="party">People in your party</label><input id="party" type="number" min="1" max="30" value="5" required></div><div><label for="lodging">Lodging type</label><select id="lodging">${stays.map(x=>`<option ${x.id===id?'selected':''}>${x.type}</option>`).join('')}</select></div></div><p class="error" id="form-error" role="alert"></p><button class="btn" type="submit">Create my checklist</button></form><div id="confirmation" role="status"></div></section><aside><h2>Confirm with your host</h2><ul><li>Room availability for your dates and group.</li><li>Total price, including any fees.</li><li>Cancellation and payment terms.</li><li>Amenities and accessibility needs.</li><li>Check-in details and transportation.</li></ul><p class="note">Prototype only. No booking is made, no payment is requested, and your dates are not sent anywhere.</p><a href="#/stay/${id}">← Back to lodging details</a></aside></div>`}
function eat(id){if(id){const c=cuisines.find(x=>x.id===id);if(!c)return missing();return `${crumb(c.name,['eat','Food and Dining'])}<section class="detail"><div class="detail-art">${art('food')}</div><div class="detail-body"><div class="eyebrow">Local dining guide</div><h1>${c.name}</h1><p class="lead">${c.text}</p><p>Restaurant names, menus, prices, and opening hours are not supplied in this prototype.</p><p class="note">Many restaurants close on national holidays. Confirm opening times when planning a visit.</p><a href="#/info/holidays">Check holiday information ↗</a><p><a href="#/eat">← Back to Food and Dining</a></p></div></section>`}let shown=cuisines.filter(x=>selectedFilter==='All'||x.name===selectedFilter);return `${crumb('Food and Dining')}${intro('A taste of Taniti','Pull up a chair.','Explore three types of cuisine across the island’s ten restaurants.')} ${filters(['All',...cuisines.map(x=>x.name)])}<div class="grid">${shown.map(c=>`<article class="card">${art('food')}<div class="card-body"><span class="tag">${c.count} restaurants</span><h3>${c.name}</h3><p>${c.text}</p><a class="link" href="#/eat/${c.id}">View cuisine details ↗</a></div></article>`).join('')}</div><section class="practical"><div><h2>Groceries & essentials</h2><p>Two supermarkets, two smaller grocery stores, and one convenience store that is open 24 hours a day.</p></div></section>`}
function travel(){return `${crumb('Getting Around')}${intro('The journey, made clearer','Arrive. Settle in. Explore.','Find your way to Taniti and choose how to travel around the island.')}<div class="filters"><a class="filter" href="#/info/arriving">Arriving on Taniti</a><a class="filter" href="#/info/on-island">On the island</a></div><h2 id="arriving">Arriving on Taniti</h2><div class="info-grid"><article class="info"><div class="eyebrow">By air</div><h2>A small island airport</h2><p>Almost all visitors arrive by air. The airport accommodates small jets and propeller planes. An expansion for larger jets is planned; it is not treated as completed here.</p></article><article class="info"><div class="eyebrow">By sea</div><h2>Yellow Leaf Bay</h2><p>A small cruise ship docks in Yellow Leaf Bay for one night per week. Confirm travel schedules with your carrier.</p></article></div><h2 id="on-island" style="margin-top:42px">On the island</h2><div class="info-grid"><article class="info"><div class="eyebrow">Public buses · Taniti City</div><strong class="big">5 a.m. – 11 p.m.</strong><p>Public buses operate every day within Taniti City. Private buses serve the rest of the island.</p></article><article class="info"><div class="eyebrow">Rental cars & taxis</div><h2>Travel on your schedule</h2><p>A local rental-car agency is near the airport. Taxis are available in Taniti City.</p></article><article class="info"><div class="eyebrow">Walking</div><h2>Explore at your own pace</h2><p>Taniti City is fairly flat and very walkable. The area around Merriton Landing is also easy to explore on foot.</p></article><article class="info"><div class="eyebrow">Bike rentals</div><h2>Two wheels, island views</h2><p>Several vendors rent bicycles and helmets. Helmets are required by law.</p></article></div>${callout()}`}
const faqs=[['currency','What currency should I bring?','Taniti uses the U.S. dollar. Many businesses also accept euros and yen. Several banks facilitate currency exchange, and many businesses accept major credit cards.'],['electricity','What kind of power outlets are used?','Power outlets are 120 volts, the same as in the United States.'],['holidays','Will places be open on holidays?','Taniti has many national holidays. Many tourist attractions and restaurants close on holidays, so plan ahead and confirm opening times.'],['health','Where can I get medical help?','Taniti has one hospital and several clinics. The hospital has many multilingual employees.'],['language','Is English spoken on the island?','Many younger Tanitians speak fluent English. Very little English is spoken in rural areas, especially by older residents.'],['safety','What should I know about safety?','Violent crime is very rare, but reports of pickpocketing and other petty crimes have increased with tourism. Keep track of your belongings.'],['alcohol','What are the alcohol rules?','The drinking age is 18. Alcohol may not be served or sold between midnight and 9 a.m.']];
function info(id){return `${crumb('Travel Information')}${intro('Know before you go','A few things to know.','Practical details to help you prepare for your time on Taniti.')}<div class="info-grid"><article class="info"><div class="eyebrow">Currency</div><h2>U.S. dollar</h2><p>Many businesses accept major credit cards. Expand the currency question below for more details.</p><a href="#/info/currency">Currency details ↗</a></article><article class="info"><div class="eyebrow">Plan around holidays</div><h2>Check before you go</h2><p>Attractions and restaurants may close on national holidays.</p><a href="#/info/holidays">Holiday information ↗</a></article></div><section style="margin-top:30px" aria-label="Frequently asked questions">${faqs.map(([key,q,a])=>`<details id="faq-${key}" ${key===id?'open':''}><summary>${q}</summary><p>${a}</p></details>`).join('')}</section><section id="transport" style="margin-top:50px"><h2>Getting Around</h2>${travel().slice(travel().indexOf('<div class="filters">')).replace(callout(),'')}</section>`}
function plan(){let picked=activities.filter(x=>saved.includes(x.id));return `${crumb('My saved activities')}${intro('Your island shortlist','A little inspiration, saved.','Keep track of activities you would like to explore. Saved items stay in this browser when local storage is available.')}<div class="grid">${picked.length?picked.map(x=>`<article class="card">${art(x.art)}<div class="card-body"><h3>${x.name}</h3><p><a href="#/do/${x.id}">View details ↗</a></p><button class="saved remove" data-id="${x.id}">Remove from saved</button></div></article>`).join(''):'<p class="empty">Your list is empty. <a href="#/do">Explore activities</a> and save the ones you like.</p>'}</div>`}
function planning(id){const a=activities.find(x=>x.id===id);if(!a)return missing();return `${crumb('Planning information',['do/'+id,a.name])}${intro('Plan your outing',a.name,'A few things to confirm before you go.')}<div class="info"><ul><li>Check opening times, holiday closures, and current conditions.</li><li>Confirm any fees, equipment, age requirements, or accessibility needs.</li><li>Arrange transportation and confirm the meeting point.</li></ul><p>Operator contacts, current prices, and schedules are not supplied in this prototype.</p><div class="actions"><a class="btn" href="#/info/transport">Getting Around</a><a class="btn secondary" href="#/do/${id}">Back to activity</a></div></div>`}
function missing(){return intro('Page not found','Let’s get you back.','This page is unavailable.')+'<a class="btn" href="#/">Go home</a>'}
function render(reset=true){const path=location.hash.slice(1)||'/';const [,type,id]=path.split('/');if(reset)selectedFilter='All';$('#navigation').innerHTML=routes.map(([r,label])=>`<a href="#${r}" ${r==='/'?path==='/'?'aria-current="page"':'':path===r||path.startsWith(r+'/')?'aria-current="page"':''}>${label}</a>`).join('');$('#navigation').classList.remove('open');$('.menu').setAttribute('aria-expanded','false');$('.menu').textContent='Menu';main.innerHTML=type===''?home():type==='stay'?(id?detail(type,id):list(type)):type==='do'?(id?detail(type,id):list(type)):type==='booking'?booking(id):type==='eat'?eat(id):type==='travel'?travel():type==='info'?info(id):type==='plan'?plan():type==='activity-planning'?planning(id):missing();document.title=(main.querySelector('h1')?.textContent||'Taniti')+' | Taniti Travel (Before Feedback)';if(reset){window.scrollTo(0,0);main.focus({preventScroll:true});if(type==='travel'&&id)document.getElementById(id)?.scrollIntoView();if(type==='info'&&id)(document.getElementById('faq-'+id)||document.getElementById(id))?.scrollIntoView()}bind();}
function saveStore(){try{localStorage.setItem('tanitiSaved',JSON.stringify(saved))}catch{}}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{selectedFilter=b.dataset.filter;render(false);document.querySelector(`[data-filter="${selectedFilter}"]`).focus()}));$('#save')?.addEventListener('click',e=>{let id=e.currentTarget.dataset.id;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];saveStore();let b=e.currentTarget;b.textContent=saved.includes(id)?'Saved to my activities ✓':'Save this activity +';b.setAttribute('aria-pressed',saved.includes(id));$('#save-status').innerHTML=`${saved.includes(id)?'Activity saved.':'Activity removed.'} <a href="#/plan">View my saved activities</a>`});document.querySelectorAll('.remove').forEach(b=>b.addEventListener('click',()=>{saved=saved.filter(x=>x!==b.dataset.id);saveStore();render(false)}));$('#booking-form')?.addEventListener('submit',e=>{e.preventDefault();const a=$('#arrival').value,d=$('#departure').value;$('#confirmation').innerHTML='';if(d<=a){$('#form-error').textContent='Choose a departure date after your arrival date.';$('#departure').focus();return}$('#form-error').textContent='';$('#confirmation').innerHTML=`<div class="success"><h2>Your enquiry checklist is ready.</h2><p>${$('#party').value} guests · ${$('#lodging').value}<br>${a} to ${d}</p><p>Confirm availability, total cost, cancellation terms, and check-in details with your accommodation provider.</p><strong>This is a checklist, not a reservation.</strong></div>`;$('#confirmation').scrollIntoView({behavior:'smooth',block:'nearest'})});}
$('.menu').addEventListener('click',()=>{const open=$('#navigation').classList.toggle('open');$('.menu').setAttribute('aria-expanded',open);$('.menu').textContent=open?'Close menu':'Menu'});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#navigation').classList.remove('open');$('.menu').setAttribute('aria-expanded','false');$('.menu').textContent='Menu'}});window.addEventListener('hashchange',()=>render());render();
</script></body></html>
